
name: OANDA Demo Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check OANDA practice connection
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("OANDA_API_KEY")
          account = os.environ.get("OANDA_ACCOUNT_ID")

          if not token or not account:
              raise SystemExit("Missing OANDA secrets")

          url = (
              "https://api-fxpractice.oanda.com"
              "/v3/accounts/" + account + "/summary"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept-Datetime-Format": "RFC3339"
              },
              method="GET"
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=15
              ) as response:
                  data = json.load(response)

              info = data["account"]
              print("OANDA PRACTICE CONNECTION SUCCESSFUL")
              print("Currency:", info.get("currency"))
              print("Balance:", info.get("balance"))
              print("Open trades:", info.get("openTradeCount"))

          except urllib.error.HTTPError as error:
              print("OANDA API error:", error.code)
              raise SystemExit(1)
          except Exception as error:
              print("Connection failed:", type(error).__name__)
              raise SystemExit(1)
          PY
