
name: Forex Historical Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run FXBot historical simulation
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          BASE = "https://api-fxpractice.oanda.com"
          PIP = 0.0001
          COST_PIPS = 2.0

          def fetch_candles(pair):
              query = urllib.parse.urlencode({
                  "granularity": "H1",
                  "count": 5000,
                  "price": "M"
              })
              url = f"{BASE}/v3/instruments/{pair}/candles?{query}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization":
                      f"Bearer {os.environ['OANDA_API_KEY']}"
                  }
              )
              with urllib.request.urlopen(
                  request, timeout=40
              ) as response:
                  payload = json.load(response)

              return [
                  {
                      "time": c["time"],
                      "open": float(c["mid"]["o"]),
                      "high": float(c["mid"]["h"]),
                      "low": float(c["mid"]["l"]),
                      "close": float(c["mid"]["c"])
                  }
                  for c in payload["candles"]
                  if c.get("complete")
              ]

          def indicators(bars):
              closes = [b["close"] for b in bars]
              ma20 = [None] * len(bars)
              ma50 = [None] * len(bars)
              rsi = [None] * len(bars)
              atr = [None] * len(bars)

              changes = [
                  closes[i] - closes[i-1]
                  for i in range(1, len(bars))
              ]

              for i in range(19, len(bars)):
                  ma20[i] = sum(
                      closes[i-19:i+1]
                  ) / 20

              for i in range(49, len(bars)):
                  ma50[i] = sum(
                      closes[i-49:i+1]
                  ) / 50

              if len(bars) < 51:
                  return ma20, ma50, rsi, atr

              gain = sum(
                  max(x, 0) for x in changes[:14]
              ) / 14
              loss = sum(
                  max(-x, 0) for x in changes[:14]
              ) / 14

              true_ranges = [
                  max(
                      bars[i]["high"] - bars[i]["low"],
                      abs(
                          bars[i]["high"] - closes[i-1]
                      ),
                      abs(
                          bars[i]["low"] - closes[i-1]
                      )
                  )
                  for i in range(1, len(bars))
              ]

              average_tr = sum(
                  true_ranges[:14]
              ) / 14

              for i in range(14, len(bars)):
                  if i > 14:
                      change = changes[i-1]
                      gain = (
                          gain * 13 + max(change, 0)
                      ) / 14
                      loss = (
                          loss * 13 + max(-change, 0)
                      ) / 14
                      average_tr = (
                          average_tr * 13 +
                          true_ranges[i-1]
                      ) / 14

                  if gain == 0 and loss == 0:
                      rsi[i] = 50
                  elif loss == 0:
                      rsi[i] = 100
                  else:
                      rsi[i] = 100 - 100 / (
                          1 + gain / loss
                      )

                  atr[i] = average_tr

              return ma20, ma50, rsi, atr

          def simulate(pair):
              bars = fetch_candles(pair)

              if len(bars) < 100:
                  raise RuntimeError(
                      f"Not enough candles for {pair}"
                  )

              ma20, ma50, rsi, atr = indicators(
                  bars
              )

              trades = []
              position = None
              last_exit = -100

              for i in range(60, len(bars)):
                  bar = bars[i]
                  opened_now = False

                  if (
                      position is None
                      and i > last_exit + 1
                  ):
                      previous = i - 1
                      direction = None

                      if (
                          atr[previous] is not None
                          and atr[previous] >= 0.0005
                      ):
                          if (
                              ma20[previous] > ma50[previous]
                              and 50 <= rsi[previous] <= 70
                          ):
                              direction = 1
                          elif (
                              ma20[previous] < ma50[previous]
                              and 30 <= rsi[previous] <= 50
                          ):
                              direction = -1

                      if direction is not None:
                          entry = bar["open"]
                          distance = atr[previous] * 1.5

                          position = {
                              "side": direction,
                              "entry": entry,
                              "stop": (
                                  entry - direction * distance
                              ),
                              "target": (
                                  entry + direction *
                                  distance * 2
                              )
                          }
                          opened_now = True

                  if position is None:
                      continue

                  p = position
                  stop = p["stop"]
                  target = p["target"]
                  exit_price = None

                  if p["side"] == 1:
                      if (
                          bar["open"] <= stop
                          and not opened_now
                      ):
                          exit_price = bar["open"]
                      elif (
                          bar["open"] >= target
                          and not opened_now
                      ):
                          exit_price = target
                      elif bar["low"] <= stop:
                          exit_price = stop
                      elif bar["high"] >= target:
                          exit_price = target
                  else:
                      if (
                          bar["open"] >= stop
                          and not opened_now
                      ):
                          exit_price = bar["open"]
                      elif (
                          bar["open"] <= target
                          and not opened_now
                      ):
                          exit_price = target
                      elif bar["high"] >= stop:
                          exit_price = stop
                      elif bar["low"] <= target:
                          exit_price = target

                  if exit_price is not None:
                      pnl = (
                          (exit_price - p["entry"])
                          * p["side"] / PIP
                          - COST_PIPS
                      )
                      trades.append(pnl)
                      position = None
                      last_exit = i

              wins = sum(
                  x > 0 for x in trades
              )

              equity = 0.0
              peak = 0.0
              drawdown = 0.0

              for pnl in trades:
                  equity += pnl
                  peak = max(peak, equity)
                  drawdown = max(
                      drawdown, peak - equity
                  )

              gains = sum(
                  x for x in trades if x > 0
              )
              losses = -sum(
                  x for x in trades if x <= 0
              )

              factor = (
                  f"{gains / losses:.2f}"
                  if losses else "N/A"
              )

              print()
              print("=" * 42)
              print("FXBOT HISTORICAL BACKTEST")
              print("PAIR:", pair)
              print("TIMEFRAME: H1")
              print("CANDLES:", len(bars))
              print("FIRST:", bars[0]["time"])
              print("LAST:", bars[-1]["time"])
              print("CLOSED TRADES:", len(trades))
              print("WINS:", wins)
              print("LOSSES:", len(trades) - wins)

              if trades:
                  print(
                      "WIN RATE:",
                      f"{100 * wins / len(trades):.2f}%"
                  )
              else:
                  print("WIN RATE: N/A")

              print(
                  "NET PIPS:",
                  f"{sum(trades):.2f}"
              )
              print("PROFIT FACTOR:", factor)
              print(
                  "MAX CLOSED-TRADE DRAWDOWN:",
                  f"{drawdown:.2f} pips"
              )
              print(
                  "ESTIMATED COST:",
                  f"{COST_PIPS} pips/trade"
              )
              print(
                  "OPEN POSITION EXCLUDED:",
                  position is not None
              )
              print("ANALYSIS ONLY - NO ORDERS")
              print("=" * 42)

          for instrument in (
              "EUR_USD",
              "GBP_USD"
          ):
              simulate(instrument)

          print()
          print("FXBot historical simulation completed.")
          print("No trades were placed.")
          PY
