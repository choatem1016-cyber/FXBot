
name: Forex Demo Market Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Analyze Forex Market
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from statistics import mean

          token = os.environ["OANDA_API_KEY"]
          account = os.environ["OANDA_ACCOUNT_ID"]
          base = "https://api-fxpractice.oanda.com"

          def get_candles(pair):
              path = (
                  "/v3/instruments/"
                  + pair + "/candles"
              )
              query = urllib.parse.urlencode({
                  "granularity": "H1",
                  "count": 120,
                  "price": "M"
              })
              request = urllib.request.Request(
                  base + path + "?" + query,
                  headers={
                      "Authorization": "Bearer " + token
                  },
                  method="GET"
              )
              with urllib.request.urlopen(
                  request, timeout=15
              ) as response:
                  data = json.load(response)

              return [
                  candle for candle in data["candles"]
                  if candle.get("complete")
              ]

          def analyze(pair):
              candles = get_candles(pair)
              if len(candles) < 51:
                  print(pair, "Not enough candles")
                  return

              closes = [
                  float(c["mid"]["c"])
                  for c in candles
              ]
              highs = [
                  float(c["mid"]["h"])
                  for c in candles
              ]
              lows = [
                  float(c["mid"]["l"])
                  for c in candles
              ]

              ma20 = mean(closes[-20:])
              ma50 = mean(closes[-50:])

              changes = [
                  closes[i] - closes[i-1]
                  for i in range(1, len(closes))
              ]
              gains = [
                  max(change, 0)
                  for change in changes[-14:]
              ]
              losses = [
                  max(-change, 0)
                  for change in changes[-14:]
              ]
              avg_gain = mean(gains)
              avg_loss = mean(losses)

              if avg_gain == 0 and avg_loss == 0:
                  rsi = 50
              elif avg_loss == 0:
                  rsi = 100
              else:
                  rsi = 100 - 100 / (
                      1 + avg_gain / avg_loss
                  )

              true_ranges = []
              for i in range(1, len(closes)):
                  tr = max(
                      highs[i] - lows[i],
                      abs(highs[i] - closes[i-1]),
                      abs(lows[i] - closes[i-1])
                  )
                  true_ranges.append(tr)

              atr = mean(true_ranges[-14:])

              if ma20 > ma50:
                  trend = "UPWARD"
              elif ma20 < ma50:
                  trend = "DOWNWARD"
              else:
                  trend = "SIDEWAYS"

              print("PAIR:", pair)
              print("Last closed candle:",
                    candles[-1]["time"])
              print("Last close:", closes[-1])
              print("MA20:", round(ma20, 5))
              print("MA50:", round(ma50, 5))
              print("RSI14:", round(rsi, 2))
              print("ATR14:", round(atr, 5))
              print("Trend:", trend)
              print("ANALYSIS ONLY - NO ORDERS")
              print("--------------------")

          for pair in ("EUR_USD", "GBP_USD"):
              analyze(pair)
          PY
