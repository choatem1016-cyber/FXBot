
name: Forex Demo Price Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Read OANDA practice prices
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          token = os.environ.get("OANDA_API_KEY")
          account = os.environ.get("OANDA_ACCOUNT_ID")

          if not token or not account:
              raise SystemExit("Missing OANDA secrets")

          pairs = "EUR_USD,GBP_USD"
          path = "/v3/accounts/" + urllib.parse.quote(
              account, safe=""
          ) + "/pricing"
          query = urllib.parse.urlencode({
              "instruments": pairs
          })
          url = (
              "https://api-fxpractice.oanda.com"
              + path + "?" + query
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + token
              },
              method="GET"
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=15
              ) as response:
                  data = json.load(response)

              for price in data.get("prices", []):
                  bids = price.get("bids", [])
                  asks = price.get("asks", [])
                  print("Pair:", price.get("instrument"))
                  print("Status:", price.get("status"))
                  print("Time:", price.get("time"))
                  if bids and asks:
                      print("Bid:", bids[0]["price"])
                      print("Ask:", asks[0]["price"])
                  print("---")

              print("Read-only price check complete.")

          except urllib.error.HTTPError as error:
              print("OANDA API error:", error.code)
              raise SystemExit(1)
          except Exception as error:
              print("Connection error:", type(error).__name__)
              raise SystemExit(1)
          PY
