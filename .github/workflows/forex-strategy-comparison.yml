
name: FXBot Strategy Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout FXBot
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.23,<2" \
            "pandas>=1.5,<3" \
            "matplotlib>=3.6,<4" \
            "scikit-learn>=1.2,<2" \
            "pytz>=2022" \
            "v20==3.0.25.0"
          python -m pip install ./tpqoa

      - name: Compare FXBot strategies
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import numpy as np
          import pandas as pd
          import v20

          from backtesting.SMABacktest import SMABacktest
          from backtesting.BollingerBandsBacktest import BollingerBandsBacktest
          from backtesting.MomentumBacktest import MomentumBacktest
          from backtesting.ContrarianBacktest import ContrarianBacktest

          api = v20.Context(
              hostname="api-fxpractice.oanda.com",
              port=443,
              token=os.environ["OANDA_API_KEY"],
              poll_timeout=30
          )

          start = pd.Timestamp("2023-01-01", tz="UTC")
          end = pd.Timestamp("2026-01-01", tz="UTC")

          candles_data = []
          cursor = start

          print("Downloading EUR/USD historical data...")

          while cursor < end:
              batch_end = min(
                  cursor + pd.Timedelta(days=7),
                  end
              )

              for attempt in range(1, 6):
                  try:
                      response = api.instrument.candles(
                          "EUR_USD",
                          granularity="H1",
                          price="M",
                          fromTime=cursor.isoformat(),
                          toTime=batch_end.isoformat()
                      )

                      if response.status != 200:
                          raise RuntimeError(
                              f"OANDA status {response.status}"
                          )

                      break

                  except v20.errors.V20Timeout:
                      if attempt == 5:
                          raise
                      print(
                          f"Timeout. Retrying batch "
                          f"{cursor.date()} "
                          f"(attempt {attempt}/5)"
                      )
                      time.sleep(attempt * 2)

              candles = response.body.get("candles", [])

              for candle in candles:
                  timestamp = pd.Timestamp(candle.time)

                  if (
                      start <= timestamp < end
                      and candle.complete
                  ):
                      candles_data.append(
                          (timestamp, float(candle.mid.c))
                      )

              print(
                  "Downloaded:",
                  cursor.date(),
                  "to",
                  batch_end.date(),
                  "-",
                  len(candles),
                  "candles"
              )

              cursor = batch_end

          if not candles_data:
              raise RuntimeError(
                  "No historical candles downloaded"
              )

          prices = pd.DataFrame(
              candles_data,
              columns=["time", "price"]
          )

          prices = (
              prices.drop_duplicates("time")
                    .set_index("time")
                    .sort_index()
          )

          prices["returns"] = np.log(
              prices["price"] / prices["price"].shift(1)
          )

          print("Total candles:", len(prices))
          print("First candle:", prices.index.min())
          print("Last candle:", prices.index.max())

          trading_cost = 0.0002

          def make_safe_class(original_class):
              class Safe(original_class):
                  input_prices = None

                  def acquire_data(self):
                      return self.input_prices.copy()

              return Safe

          strategies = [
              (
                  "SMA 50/200",
                  make_safe_class(SMABacktest),
                  {"smas": 50, "smal": 200}
              ),
              (
                  "Bollinger 20/2",
                  make_safe_class(BollingerBandsBacktest),
                  {"sma": 20, "deviation": 2}
              ),
              (
                  "Momentum 10",
                  make_safe_class(MomentumBacktest),
                  {"window": 10}
              ),
              (
                  "Contrarian 10",
                  make_safe_class(ContrarianBacktest),
                  {"window": 10}
              )
          ]

          summary = []

          for year in [2023, 2024, 2025]:
              year_start = pd.Timestamp(
                  f"{year}-01-01", tz="UTC"
              )
              year_end = pd.Timestamp(
                  f"{year + 1}-01-01", tz="UTC"
              )

              warmup_start = year_start - pd.Timedelta(
                  days=21
              )

              year_prices = prices.loc[
                  (prices.index >= warmup_start) &
                  (prices.index < year_end)
              ].copy()

              for name, cls, parameters in strategies:
                  cls.input_prices = year_prices

                  tester = cls(
                      instrument="EUR_USD",
                      start=str(warmup_start.date()),
                      end=str(year_end.date()),
                      granularity="H1",
                      trading_cost=trading_cost,
                      **parameters
                  )

                  tester.test(mute=True)
                  results = tester.get_results()

                  r = results.loc[
                      (results.index >= year_start) &
                      (results.index < year_end)
                  ].copy()

                  if r.empty:
                      raise RuntimeError(
                          f"No results for {name} in {year}"
                      )

                  strategy_return = (
                      np.exp(r["strategy"].sum()) - 1
                  ) * 100

                  equity = np.exp(
                      r["strategy"].cumsum()
                  )

                  max_drawdown = (
                      equity / equity.cummax() - 1
                  ).min() * 100

                  position_units = int(
                      r["trades"].sum()
                  )

                  summary.append({
                      "Year": year,
                      "Strategy": name,
                      "Return %": round(
                          strategy_return, 2
                      ),
                      "Max DD %": round(
                          max_drawdown, 2
                      ),
                      "Position Units": position_units
                  })

          report = pd.DataFrame(summary)

          print()
          print("=" * 70)
          print("FXBOT STRATEGY COMPARISON")
          print("=" * 70)
          print("Pair: EUR/USD")
          print("Timeframe: H1")
          print("Years: 2023, 2024, 2025")
          print("Trading cost per position unit:", trading_cost)
          print()
          print(report.to_string(index=False))
          print()
          print("Historical backtesting only.")
          print("Trading costs are approximate.")
          print("No leverage or position sizing modeled.")
          print("NO TRADING ORDERS PLACED")
          PY
